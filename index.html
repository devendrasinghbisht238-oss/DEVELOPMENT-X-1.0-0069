<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>developmentX 1.0 | Command Center</title>
    <style>
        :root {
            --bg-main: #0b1120;
            --bg-card: #1e293b;
            --cyan: #00d2ff;
            --red: #ef4444;
            --green: #10b981;
            --text-muted: #94a3b8;
        }
        body {
            background-color: var(--bg-main);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
        }
        .navbar {
            width: 100%; background: #0f172a; padding: 20px 0;
            text-align: center; border-bottom: 2px solid var(--cyan);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
            margin-bottom: 40px;
        }
        .navbar h1 {
            margin: 0; font-size: 24px; letter-spacing: 3px; font-weight: 900;
        }
        .navbar span { color: var(--cyan); }
        
        .control-panel {
            margin-bottom: 30px; display: flex; gap: 15px;
        }
        input {
            background: var(--bg-card); color: var(--cyan);
            border: 1px solid var(--cyan); padding: 12px 20px;
            border-radius: 4px; font-weight: bold; width: 250px;
            text-align: center; font-size: 14px; outline: none;
        }
        
        .dashboard-grid {
            display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; width: 90%; max-width: 1000px;
        }
        .sensor-card {
            background: var(--bg-card); border: 1px solid #334155;
            border-radius: 12px; padding: 30px; width: 100%; max-width: 400px;
            text-align: center; position: relative; overflow: hidden;
            transition: all 0.3s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .sensor-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
        }
        .card-gas::before { background: var(--cyan); }
        .card-fire::before { background: var(--red); }
        
        .card-title {
            font-size: 16px; color: var(--text-muted); font-weight: 700; letter-spacing: 1.5px;
            margin-bottom: 20px; text-transform: uppercase;
        }
        .data-display {
            font-size: 65px; font-weight: 900; font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 20px rgba(255,255,255,0.1); margin: 20px 0;
        }
        .data-gas { color: var(--cyan); }
        .data-fire { color: var(--red); }
        
        .status-bar {
            width: 100%; height: 8px; background: #334155; border-radius: 4px; margin-top: 20px; overflow: hidden;
        }
        .status-fill { height: 100%; transition: width 0.5s ease; }
        .fill-gas { background: var(--cyan); }
        .fill-fire { background: var(--red); }

        .global-alert {
            margin-top: 50px; padding: 20px 40px; font-size: 22px; font-weight: bold;
            border-radius: 8px; letter-spacing: 2px; width: 80%; max-width: 800px; text-align: center;
        }
        .alert-safe { background: rgba(16, 185, 129, 0.1); border: 1px solid var(--green); color: var(--green); }
        .alert-danger { 
            background: rgba(239, 68, 68, 0.15); border: 2px solid var(--red); color: var(--red);
            animation: pulse-danger 1s infinite;
        }

        @keyframes pulse-danger {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>development<span>X</span> 1.0</h1>
    </div>

    <div class="control-panel">
        <input type="text" id="ipInput" placeholder="ENTER ESP32 IP" value="192.168.4.1">
    </div>

    <div class="dashboard-grid">
        <!-- GAS SENSOR UI -->
        <div class="sensor-card card-gas" id="gasCard">
            <div class="card-title">💨 Toxic Gas / Smoke (MQ)</div>
            <div class="data-display data-gas" id="gasValue">--</div>
            <div style="color: var(--text-muted); font-size: 14px; font-weight: bold;">PPM (PARTS PER MILLION)</div>
            <div class="status-bar"><div class="status-fill fill-gas" id="gasBar" style="width: 0%;"></div></div>
        </div>

        <!-- FIRE SENSOR UI -->
        <div class="sensor-card card-fire" id="fireCard">
            <div class="card-title">🔥 Infrared Flame Hazard</div>
            <div class="data-display data-fire" id="fireValue">--</div>
            <div style="color: var(--text-muted); font-size: 14px; font-weight: bold;">HAZARD PERCENTAGE (%)</div>
            <div class="status-bar"><div class="status-fill fill-fire" id="fireBar" style="width: 0%;"></div></div>
        </div>
    </div>

    <div class="global-alert alert-safe" id="systemStatus">
        [ SYSTEM ONLINE ] ALL PARAMETERS NOMINAL
    </div>

    <script>
        function updateDashboard() {
            const ip = document.getElementById('ipInput').value;
            if(!ip) return;

            fetch(`http://${ip}/telemetry`)
                .then(response => response.json())
                .then(data => {
                    // Update Gas
                    document.getElementById('gasValue').innerText = data.gas;
                    let gasPercentage = Math.min((data.gas / 2000) * 100, 100); 
                    document.getElementById('gasBar').style.width = gasPercentage + "%";

                    // Update Fire
                    document.getElementById('fireValue').innerText = data.flame;
                    document.getElementById('fireBar').style.width = data.flame + "%";

                    // Update Global Status & Animations
                    const statusBox = document.getElementById('systemStatus');
                    const gasCard = document.getElementById('gasCard');
                    const fireCard = document.getElementById('fireCard');

                    if (data.gas > 1500 || data.flame > 50) {
                        statusBox.innerText = "🚨 CRITICAL: FIRE OR GAS LEAK DETECTED!";
                        statusBox.className = "global-alert alert-danger";
                        
                        if(data.gas > 1500) gasCard.style.borderColor = "#ef4444";
                        if(data.flame > 50) fireCard.style.borderColor = "#ef4444";
                    } else {
                        statusBox.innerText = "[ SYSTEM ONLINE ] PERIMETER SECURE";
                        statusBox.className = "global-alert alert-safe";
                        gasCard.style.borderColor = "#334155";
                        fireCard.style.borderColor = "#334155";
                    }
                })
                .catch(err => {
                    document.getElementById('systemStatus').innerText = "❌ CONNECTION LOST TO SENSOR NODE";
                    document.getElementById('systemStatus').className = "global-alert alert-danger";
                });
        }

        // Fetch data every 1 second
        setInterval(updateDashboard, 1000);
    </script>
</body>
</html>
